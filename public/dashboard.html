
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        button {
            border: 0;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .logout {
            background: #dc2626;
        }

        .carousel {
            margin-top: 25px;
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .carousel img {
            display: block;
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #eee;
            border-radius: 8px;
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 12px;
        }

        #slideTitle {
            text-align: center;
            margin: 12px 0 0;
        }

        .panel {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .image-item {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .image-item img {
            width: 90px;
            height: 65px;
            object-fit: cover;
            border-radius: 5px;
        }

        .image-info {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .edit {
            background: #d97706;
        }

        .delete {
            background: #dc2626;
        }

        #message {
            margin-top: 10px;
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .carousel img {
                height: 250px;
            }

            .image-item {
                flex-wrap: wrap;
            }

            header {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>My Image Dashboard</h1>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <section class="carousel">

        <img id="carouselImage" src="" alt="Carousel image">

        <h3 id="slideTitle">No images available</h3>

        <div class="carousel-controls">
            <button onclick="previousSlide()">Previous</button>
            <span id="slideCounter">0 / 0</span>
            <button onclick="nextSlide()">Next</button>
            <button onclick="toggleAutoplay()" id="playButton">Pause</button>
        </div>

    </section>

    <section class="panel">

        <h2 id="formTitle">Add New Image</h2>

        <form id="imageForm">

            <label for="title">Image Title</label>
            <input
                type="text"
                id="title"
                placeholder="Enter image title"
                required
            >

            <label for="imageUrl">Image URL</label>
            <input
                type="url"
                id="imageUrl"
                placeholder="https://example.com/image.jpg"
                required
            >

            <button type="submit" id="saveButton">
                Save Image
            </button>

            <button
                type="button"
                id="cancelButton"
                onclick="cancelEdit()"
                hidden
            >
                Cancel Edit
            </button>

        </form>

        <p id="message"></p>

    </section>

    <section class="panel">

        <h2>Manage Carousel Images</h2>

        <div id="imageList">
            Loading images...
        </div>

    </section>

</div>

<script src="/dashboard.js"></script>

</body>
</html>
